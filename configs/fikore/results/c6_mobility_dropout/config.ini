# C6: Mobility / dropout proxy
# Calibrated project-specific network condition. Relative map and timeline paths
# resolve from the FikoRE working directory; see the pack README before moving it.
[Global]
duration: 180
period: -1
multithreading: true
threads: 16
verbose: false
progress_log_period_s: 10

[UE]
ue_id: studyVqeg
ue_type: 1
n_ues: 1
n_antennas: 1
alpha_ul: 0.8
nominal_pusch_p0: -60
set_ul_pow: true
tx_power_ul: 23
cqi_period: 5
ri_period: 5
scaling_factor: 1
random_v: true
log_freq: 100
log_ue: true
log_quality: true
log_traffic: true
log_mobility: true
traffic_type: 0
ul_target: 1.0
dl_target: 40.000000
var_perc: 0.050000
pkt_size: 12000
mobility_type: 5
pos_x: 400.000000
pos_y: 0.000000
random_init: false
speed: 60.000000
speed_var: 5.000000
max_distance: 5000.000000
time_target: 5.000000
time_target_var: 0.000000
priority: 1.000000
delta_metric: 1.0
delay_t_metric: 0.1
pkt_delay_budget: 5.000000
l4s_dual_queue: false
l4s_target_ms: 15
l4s_rtt_max_ms: 100
l4s_min_th_us: 800
l4s_range_us: 400
l4s_k: 2.0
l4s_classic_guard_ms: 1.0
ue_height: 1.5
ue_location_type: vehicle
vehicle_penetration: standard

[Scenario]
scenario_type: 2
map_file: include/maps_scenarios/macroscopic_fading_map_RURAL_MACROCELL_3.5.json

[eNBConfig]
modulation_m: 1
target_ber: 0.00005
cqi_mode: 1
tx_power: 46.0
eNB_gain: 8.7
UT_gain: 0
power_boost: 2
frequency: 3500000000.0
bandwidth: 100000000.0

[PDCP_RLC]
backhaul_d: 0.025000
backhaul_d_var: 0.020000
order_pkts: true

[MACLayer]
metric_type: 6
pf_alpha: 1.0
throughput_time_window_ms: 100.0
throughput_intra_tti_update: allocation_unit
log_freq: 10
log_mac: true
mimo_layers: 1
n_ofdm_syms: 14
n_re_freq: 12
numerology: 1
max_rtx_ul: 4
max_rtx_dl: 4
harq_model: legacy_bler
mcs_tables: true
scheduling_mode: 1
scheduling_type: 0
scheduling_config: 1
duplexing_type: 0
n_dl_slots: 7
n_ul_slots: 3
transition_c: 54
ratio_DL_UL: 0.5

[PHYLayer]
interference_ues: 5
interference_eNBs: 1
distance_interference: 3500
interfered_bandwidth_ratio: 0.1
thermal_noise: -174
enb_noise_figure: 2
ut_noise_figure: 9
air_delay_var_ul: 0.0
rtx_period_ul: 0.004
rtx_period_var_ul: 0
rtx_proc_delay_ul: 0.002
rtx_proc_delay_var_ul: 0.0
air_delay_var_dl: 0.0
rtx_period_dl: 0.005
rtx_period_var_dl: 0
rtx_proc_delay_dl: 0.002
rtx_proc_delay_var_dl: 0.0

[Control]
enabled: true
transport: file
timeline_file: ../configs/fikore/timelines/c6_mobility_dropouts.ndjson
