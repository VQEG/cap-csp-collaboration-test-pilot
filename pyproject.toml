[project]
name = "capcsp"
version = "0.1.0"
description = "VQEG CAP-CSP collaboration pilot: short-form video player and network co-simulation harness"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
dependencies = ["fikore-transport"]

[project.scripts]
capcsp = "capcsp.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
fikore-transport = { path = "5g-network-emulator/transport", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["capcsp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
