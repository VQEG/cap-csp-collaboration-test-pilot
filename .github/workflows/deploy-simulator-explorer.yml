# Builds the simulator explorer (docs/simulator-explorer) and publishes it on
# GitHub Pages on every push to master.
#
# URL today:  https://vqeg.github.io/cap-csp-collaboration-test-pilot/
# URL later:  https://vqeg.org/cap-csp-collaboration-test-pilot/
# Once vqeg.org is set as the custom domain of the organization site
# (VQEG/vqeg.github.io), GitHub serves this project site under that domain and
# redirects the vqeg.github.io URL. Nothing in this workflow needs to change.
name: Deploy simulator explorer

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/simulator-explorer
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/simulator-explorer/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/simulator-explorer/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
